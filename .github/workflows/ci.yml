name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: review
        uses: ./
        with:
          mode: review
          plan: tests/fixtures/plan_review.json
          provider: none
          comment: "false"
      - id: drift
        uses: ./
        with:
          mode: drift
          plan: tests/fixtures/plan_drift.json
          provider: none
          comment: "false"
      - name: Check outputs
        run: |
          test "${{ steps.review.outputs.max-severity }}" = critical
          test "${{ steps.drift.outputs.drift-detected }}" = true
          test -s "${{ steps.review.outputs.report-file }}"
