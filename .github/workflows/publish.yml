name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing (OIDC), so no API token is stored.
# One-time setup on https://pypi.org/manage/account/publishing/ ("Add a new pending publisher"):
#   PyPI project name: tfscout · Owner: mikonoid · Repository: tfscout
#   Workflow: publish.yml · Environment: pypi
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/tfscout/__init__.py').read())[1])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::release tag v$tag does not match __version__ $version"
            exit 1
          fi
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
